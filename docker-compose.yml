services:
  campus-board:
    build: .
    container_name: campus-board
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/config/config.json:ro
      - board-data:/data
    environment:
      - TZ=America/Los_Angeles
      # Or keep the token out of config.json:
      # - ESPACE_TOKEN=${ESPACE_TOKEN}

volumes:
  board-data:
