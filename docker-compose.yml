services:
  campus-board:
    build: .
    # Or use the published image instead of building:
    # image: ghcr.io/OWNER/REPO:latest
    container_name: campus-board
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env          # ESPACE_TOKEN and TZ
    volumes:
      - ./config.json:/config/config.json:ro
      - board-data:/data

volumes:
  board-data:
